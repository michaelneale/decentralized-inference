name: CI Linux Runtime Slice

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable product source revision.
        required: true
        type: string
      original_event_name:
        description: Original event used for protected runner and cache policy.
        required: false
        default: ''
        type: string
      force_hosted:
        description: Force GitHub-hosted placement for runner-contract changes.
        required: false
        default: false
        type: boolean
      runtime_matrix:
        description: JSON Linux runtime rows from the versioned CI plan.
        required: true
        type: string
      max_parallel:
        description: Runtime worker budget.
        required: false
        default: 2
        type: number
      fail_fast:
        description: Cancel sibling runtime builds after the first required failure.
        required: false
        default: false
        type: boolean
      use_depot:
        description: Opt into the guarded main-only Depot canary.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

env:
  CACHE_NAMESPACE: mesh-llm
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "false"

jobs:
  runner_policy:
    name: Select Linux native runner
    if: ${{ inputs.runtime_matrix != '[]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      runner_16: ${{ steps.policy.outputs.runner_16 }}
      allow_depot_remote_cache: ${{ steps.policy.outputs.allow_depot_remote_cache }}
      allow_native_github_cache: ${{ steps.policy.outputs.allow_native_github_cache }}
      allow_trusted_sccache_seed: ${{ steps.policy.outputs.allow_trusted_sccache_seed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Select provider for the native runtime role
        id: policy
        uses: ./.github/actions/select-ci-runners
        with:
          event_name: ${{ github.event_name }}
          original_event_name: ${{ inputs.original_event_name }}
          repository: ${{ github.repository }}
          head_repository: ${{ github.event.pull_request.head.repo.full_name }}
          head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          ref: ${{ github.ref }}
          depot_main_enabled: ${{ vars.DEPOT_RUNNERS_ENABLED == 'true' }}
          depot_pr_enabled: ${{ vars.DEPOT_PR_RUNNERS_ENABLED == 'true' }}
          pr_canary_ref: ${{ vars.DEPOT_PR_CANARY_REF }}
          pr_approved_ref: ${{ vars.DEPOT_PR_APPROVED_REF }}
          pr_approved_sha: ${{ vars.DEPOT_PR_APPROVED_SHA }}
          force_hosted: ${{ inputs.force_hosted }}
          manual_use_depot: ${{ inputs.use_depot }}

  linux_runtime:
    name: Linux runtime (${{ matrix.runtime.backend }})
    needs: runner_policy
    if: ${{ !cancelled() && inputs.runtime_matrix != '[]' && needs.runner_policy.result == 'success' }}
    runs-on: ${{ needs.runner_policy.outputs.runner_16 }}
    timeout-minutes: 75
    strategy:
      fail-fast: ${{ inputs.fail_fast }}
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        runtime: ${{ fromJson(inputs.runtime_matrix) }}
    container:
      image: ${{ matrix.runtime.container_image }}
    defaults:
      run:
        shell: bash
    env:
      LLAMA_STAGE_BACKEND: ${{ matrix.runtime.backend }}
      LLAMA_STAGE_BUILD_DIR: ${{ matrix.runtime.build_dir }}
      LLAMA_STAGE_CUDA_ARCHITECTURES: ${{ matrix.runtime.cuda_architectures }}
      LLAMA_STAGE_AMDGPU_TARGETS: ${{ matrix.runtime.rocm_architectures }}
      MESH_CUDA_VERSION: ${{ matrix.runtime.cuda_version }}
      MESH_LLM_REQUIRE_SCCACHE: "1"
      GGML_CUDA_NO_VMM: "1"
      LLAMA_STAGE_SKIP_NCCL: "1"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: Mesh-LLM/mesh-llm/.github/actions/audit-depot-pr-isolation@ed07043b84d720aab30e75ed2f038f7042576f16
        with:
          original_event_name: ${{ inputs.original_event_name }}
          depot_selected: ${{ startsWith(needs.runner_policy.outputs.runner_16, 'depot-') }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify prebuilt native environment
        env:
          VERIFY_BACKEND: ${{ matrix.runtime.verify_backend }}
        run: |
          read -r -a verify_args <<< "$VERIFY_BACKEND"
          verify-runner-image "${verify_args[@]}"
      - name: Resolve native toolchain epoch
        id: native_toolchain
        uses: ./.github/actions/resolve-native-toolchain-epoch
        with:
          pinned_epoch: ${{ matrix.runtime.toolchain_epoch }}
      - id: sccache_seed
        uses: ./.github/actions/restore-sccache-seed
        with:
          # Three verified warm samples in run 34272984200/1 observed zero reuse.
          allow_trusted_seed: "false"
          cache_key: mesh-llm-sccache-seed-linux-x86_64-img-8d93de6b-epoch-8d93de6b-v2-${{ hashFiles('Cargo.lock', '.github/cache-version.txt', 'Justfile', 'just/**') }}
      - uses: ./.github/actions/configure-sccache-gha
        with:
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
      - name: Prepare immutable Linux native runtime
        uses: ./.github/actions/prepare-native-runtime-input
        with:
          backend: ${{ matrix.runtime.backend }}
          target: ${{ matrix.runtime.target }}
          output_dir: runtime-input
      - name: Upload immutable Linux runtime input
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-runtime-linux-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}
          path: |
            runtime-input/*.tar.gz
            runtime-input/*.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Capture native cache evidence
        if: ${{ !cancelled() }}
        uses: ./.github/actions/capture-sccache-stats
        with:
          artifact_name: sccache-ci-runtime-linux-${{ matrix.runtime.architecture }}-${{ matrix.runtime.backend }}-${{ github.run_attempt }}
          cache_expectation: ${{ steps.sccache_seed.outputs.cache_hit == 'true' && 'warm' || 'cold' }}
          minimum_hit_rate: "0.01"
