name: CI macOS Product Smoke Slice

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable product source revision.
        required: true
        type: string
      architecture:
        description: Selected macOS product architecture.
        required: true
        type: string
      smoke_matrix:
        description: JSON platform smoke rows from the versioned CI plan.
        required: true
        type: string
      binary_target:
        description: Product binary path used by the smoke harness.
        required: true
        type: string
      timeout_minutes:
        description: Bounded smoke timeout.
        required: false
        default: 25
        type: number
    secrets:
      HF_TOKEN:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  metal_model_load:
    name: Metal model-load smoke
    if: ${{ contains(fromJson(inputs.smoke_matrix).*.id, 'metal-model-load') }}
    uses: ./.github/workflows/smoke.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      artifact_name: ci-product-macos-${{ inputs.architecture }}-metal
      artifact_path: ci-artifacts/macos
      mesh_binary_target: ${{ inputs.binary_target }}
      cache_key_prefix: ""
      runner: macos-15
      timeout_minutes: ${{ inputs.timeout_minutes }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  product_integration_metal:
    name: Metal product integration suite
    if: ${{ contains(fromJson(inputs.smoke_matrix).*.id, 'product-integration-metal') }}
    uses: ./.github/workflows/product-integration-smoke.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      artifact_name: ci-product-macos-${{ inputs.architecture }}-metal
      artifact_path: ci-artifacts/macos
      staged_binary_path: ${{ inputs.binary_target }}
      platform: macos
      backend: metal
      timeout_minutes: ${{ inputs.timeout_minutes }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
