name: CI Web Slice

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable product source revision.
        required: false
        default: ''
        type: string
      original_event_name:
        description: Original event used for protected runner and cache policy.
        required: false
        default: ''
        type: string
      force_hosted:
        description: Force GitHub-hosted placement for runner-contract changes.
        required: false
        default: false
        type: boolean
      ui_changed:
        description: Whether the console UI source changed.
        required: true
        type: boolean
      website_changed:
        description: Whether the public website source changed.
        required: true
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  runner_policy:
    name: Select website runner
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      runner_4: ${{ steps.policy.outputs.runner_4 }}
      allow_depot_remote_cache: ${{ steps.policy.outputs.allow_depot_remote_cache }}
      allow_native_github_cache: ${{ steps.policy.outputs.allow_native_github_cache }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Select provider for the website role
        id: policy
        uses: ./.github/actions/select-ci-runners
        with:
          event_name: ${{ github.event_name }}
          original_event_name: ${{ inputs.original_event_name }}
          repository: ${{ github.repository }}
          head_repository: ${{ github.event.pull_request.head.repo.full_name }}
          head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          ref: ${{ github.ref }}
          # Website is not in the existing trusted-main Depot allowlist.
          depot_main_enabled: 'false'
          depot_pr_enabled: ${{ vars.DEPOT_PR_RUNNERS_ENABLED == 'true' }}
          pr_canary_ref: ${{ vars.DEPOT_PR_CANARY_REF }}
          pr_approved_ref: ${{ vars.DEPOT_PR_APPROVED_REF }}
          pr_approved_sha: ${{ vars.DEPOT_PR_APPROVED_SHA }}
          force_hosted: ${{ inputs.force_hosted }}

  ui_quality:
    name: Console UI quality
    needs: runner_policy
    if: ${{ inputs.ui_changed }}
    runs-on: ${{ needs.runner_policy.outputs.runner_4 }}
    timeout-minutes: 20
    container:
      image: ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:b0fa8081c77334b47744f87a0dd46bf092dfc8badc75a832b72233feb026ec25
    defaults:
      run:
        working-directory: crates/mesh-llm-ui
    steps:
      - uses: Mesh-LLM/mesh-llm/.github/actions/audit-depot-pr-isolation@ed07043b84d720aab30e75ed2f038f7042576f16
        with:
          original_event_name: ${{ inputs.original_event_name }}
          depot_selected: ${{ startsWith(needs.runner_policy.outputs.runner_4, 'depot-') }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      # The container image bakes a warm pnpm store at
      # /home/runner/.local/share/pnpm/store (mesh-llm-runner-images
      # scripts/warm-dependencies.sh). Point pnpm at it directly instead of
      # the Actions cache: containerized jobs fix $HOME to /github/home, so
      # neither pnpm's default store-dir resolution nor a plain HOME
      # override can find the baked store from in here, and restoring
      # ~/.pnpm-store from the Actions cache reported a hit but the files
      # didn't land where pnpm looks for them (#1392). Using the image's
      # own store sidesteps both and needs no cache round trip at all.
      - name: Point pnpm at the image's baked store
        run: pnpm config set store-dir /home/runner/.local/share/pnpm/store
      - name: Install UI dependencies
        run: pnpm i --frozen-lockfile
      - name: Lint UI
        run: pnpm run lint
      - name: Type-check UI
        run: pnpm run typecheck
      - name: Test UI
        run: pnpm test

  ui_e2e:
    name: Console UI E2E (Playwright)
    needs: runner_policy
    if: ${{ inputs.ui_changed }}
    runs-on: ${{ needs.runner_policy.outputs.runner_4 }}
    timeout-minutes: 20
    container:
      image: ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:4c3f0a73b8d47c10f2ac98047b3f1ca226992dcff72cb57b029238c98b828f94
    defaults:
      run:
        working-directory: crates/mesh-llm-ui
    steps:
      - uses: Mesh-LLM/mesh-llm/.github/actions/audit-depot-pr-isolation@ed07043b84d720aab30e75ed2f038f7042576f16
        with:
          original_event_name: ${{ inputs.original_event_name }}
          depot_selected: ${{ startsWith(needs.runner_policy.outputs.runner_4, 'depot-') }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      # See ui_quality's "Point pnpm at the image's baked store" step for why
      # this doesn't use the Actions cache (#1392).
      - name: Point pnpm at the image's baked store
        run: pnpm config set store-dir /home/runner/.local/share/pnpm/store
      - name: Install UI dependencies
        run: pnpm i --frozen-lockfile
      - name: Verify prebuilt web environment
        # The image bakes PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1, so a stray
        # `playwright install` elsewhere becomes a no-op instead of a silent
        # re-download. This asserts the resolved @playwright/test version
        # actually matches what the image baked and verified at build time
        # (/etc/mesh-runner-playwright-version), not the pin file.
        # shell: bash is required here: GitHub Actions defaults container
        # jobs' run: steps to sh, and the <<< here-string below is a
        # bashism dash/sh rejects ("Syntax error: redirection unexpected").
        shell: bash
        run: |
          resolved="$(pnpm exec playwright --version | head -n1 | awk '{print $NF}')"
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"$resolved" \
            || { echo "unexpected playwright --version output: $resolved" >&2; exit 1; }
          verify-runner-image public browser "" "" "" "" "$resolved"
      - name: Run console E2E
        run: pnpm run test:e2e
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ui-e2e-test-results
          path: crates/mesh-llm-ui/test-results/
          if-no-files-found: warn
          retention-days: 1

  website:
    name: Public website build
    needs: runner_policy
    if: ${{ inputs.website_changed }}
    runs-on: ${{ needs.runner_policy.outputs.runner_4 }}
    timeout-minutes: 20
    container:
      image: ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:1c73f0f2e4b2ce657cc9dc49c9c27374f3c364af19f884f1970331c3689da5d2
    steps:
      - uses: Mesh-LLM/mesh-llm/.github/actions/audit-depot-pr-isolation@ed07043b84d720aab30e75ed2f038f7042576f16
        with:
          original_event_name: ${{ inputs.original_event_name }}
          depot_selected: ${{ startsWith(needs.runner_policy.outputs.runner_4, 'depot-') }}
          allow_native_github_cache: ${{ needs.runner_policy.outputs.allow_native_github_cache }}
          allow_depot_remote_cache: ${{ needs.runner_policy.outputs.allow_depot_remote_cache }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Install website dependencies
        working-directory: website
        run: npm ci
      - name: Build public website
        run: just website-build
      - name: Validate CLI explorer in desktop and mobile browsers
        working-directory: website
        run: npm run test:cli-explorer
