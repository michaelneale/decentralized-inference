name: CI · Linux
run-name: CI · Linux · ${{ inputs.source_sha }}

on:
  workflow_call:
    inputs: &lane_inputs
      lane_plan_json:
        required: true
        type: string
      plan_digest:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      original_event_name:
        required: true
        type: string
      correlation_id:
        required: false
        default: ""
        type: string
      supersession_key:
        required: false
        default: ""
        type: string
      lane_check_id:
        required: false
        default: ""
        type: string
      overall_check_id:
        required: false
        default: ""
        type: string
      expected_lane_checks:
        required: false
        default: "[]"
        type: string
      use_depot:
        description: Opt into the guarded main-only Depot canary.
        required: false
        default: false
        type: boolean
    secrets:
      HF_TOKEN:
        required: false
  workflow_dispatch:
    inputs: *lane_inputs
permissions:
  contents: read
  packages: read

concurrency:
  group: ci-linux-${{ inputs.supersession_key || inputs.source_sha }}
  cancel-in-progress: ${{ inputs.original_event_name == 'pull_request' }}

jobs:
  ui_artifact:
    name: Console artifact
    if: ${{ fromJson(inputs.lane_plan_json).required && fromJson(inputs.lane_plan_json).matrices.hosts[0] != null }}
    uses: ./.github/workflows/ci-ui-artifact-slice.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      artifact_name: ci-ui-dist-linux-${{ github.run_id }}
      retention_days: 1

  static_abi:
    name: Static ABI
    if: ${{ contains(fromJson(inputs.lane_plan_json).required_slices, 'static-abi') }}
    uses: ./.github/workflows/static-abi-artifact.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      backend: cpu
      target: x86_64-unknown-linux-gnu
      artifact_name: ci-static-abi-${{ github.run_id }}
      runner_size: '8'
      retention_days: 1
      timeout_minutes: 60

  rust_tests:
    name: Rust tests
    needs: [static_abi]
    if: ${{ !cancelled() && needs.static_abi.result == 'success' && fromJson(inputs.lane_plan_json).matrices.rust_tests[0] != null }}
    uses: ./.github/workflows/ci-rust-tests-slice.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      rust_tests_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.rust_tests) }}
      static_abi_artifact_name: ci-static-abi-${{ github.run_id }}
      static_abi_toolchain_epoch: ${{ needs.static_abi.outputs.toolchain_epoch }}
      max_parallel: ${{ fromJson(inputs.lane_plan_json).budgets.linux_max_parallel }}
      fail_fast: ${{ inputs.original_event_name == 'pull_request' }}

  hosts:
    name: Neutral Linux host
    needs: [ui_artifact]
    if: ${{ !cancelled() && needs.ui_artifact.result == 'success' && fromJson(inputs.lane_plan_json).matrices.hosts[0] != null }}
    uses: ./.github/workflows/ci-linux-host-slice.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      hosts_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.hosts) }}
      ui_artifact_name: ci-ui-dist-linux-${{ github.run_id }}
      profile: release
      max_parallel: ${{ fromJson(inputs.lane_plan_json).budgets.linux_max_parallel }}
      fail_fast: ${{ inputs.original_event_name == 'pull_request' }}
      use_depot: ${{ inputs.use_depot }}

  native_runtimes:
    name: Native Linux runtimes
    if: ${{ fromJson(inputs.lane_plan_json).matrices.runtime_products[0] != null }}
    uses: ./.github/workflows/ci-linux-runtime-slice.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      runtime_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.runtime_products) }}
      max_parallel: ${{ fromJson(inputs.lane_plan_json).budgets.linux_max_parallel }}
      fail_fast: ${{ inputs.original_event_name == 'pull_request' }}
      use_depot: ${{ inputs.use_depot }}

  runtime_product:
    name: Linux products
    needs: [hosts, native_runtimes]
    if: ${{ !cancelled() && needs.hosts.result == 'success' && needs.native_runtimes.result == 'success' }}
    uses: ./.github/workflows/ci-linux-product-slice.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      runtime_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.runtime_products) }}
      max_parallel: ${{ fromJson(inputs.lane_plan_json).budgets.linux_max_parallel }}
      fail_fast: ${{ inputs.original_event_name == 'pull_request' }}

  kotlin_sdk_input:
    name: Kotlin SDK input
    needs: [static_abi]
    if: ${{ !cancelled() && needs.static_abi.result == 'success' && contains(fromJson(inputs.lane_plan_json).matrices.sdk.*.id, 'kotlin') }}
    uses: ./.github/workflows/native-sdk-artifact.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      original_event_name: ${{ inputs.original_event_name }}
      force_hosted: ${{ fromJson(inputs.lane_plan_json).signals.runner_contract_required }}
      backend: cpu
      target: x86_64-unknown-linux-gnu
      profile: release
      artifact_name: ci-sdk-kotlin-native
      static_abi_artifact_name: ci-static-abi-${{ github.run_id }}
      static_abi_artifact_path: ci-sdk-kotlin-static-abi
      runner_size: '8'
      retention_days: 1

  sdk:
    name: Linux SDK smoke
    needs: [runtime_product, kotlin_sdk_input]
    if: ${{ !cancelled() && needs.runtime_product.result == 'success' && (!contains(fromJson(inputs.lane_plan_json).matrices.sdk.*.id, 'kotlin') || needs.kotlin_sdk_input.result == 'success') && fromJson(inputs.lane_plan_json).matrices.sdk[0] != null }}
    uses: ./.github/workflows/ci-linux-sdk-slice.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      sdk_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.sdk) }}
      binary_target: target/release/mesh-llm
      ui_artifact_name: ci-ui-dist-linux-${{ github.run_id }}
      profile: release
    secrets:
      HF_TOKEN: ${{ inputs.original_event_name == 'push' && secrets.HF_TOKEN || '' }}

  product_smoke:
    name: Linux product smoke
    needs: [runtime_product]
    if: ${{ !cancelled() && needs.runtime_product.result == 'success' && fromJson(inputs.lane_plan_json).matrices.smoke[0] != null }}
    uses: ./.github/workflows/ci-linux-product-smoke-slice.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      smoke_matrix: ${{ toJson(fromJson(inputs.lane_plan_json).matrices.smoke) }}
      binary_target: target/release/mesh-llm
      timeout_minutes: 45
    secrets:
      HF_TOKEN: ${{ inputs.original_event_name == 'push' && secrets.HF_TOKEN || '' }}

  summary:
    name: CI / Linux
    needs:
      - ui_artifact
      - static_abi
      - rust_tests
      - hosts
      - native_runtimes
      - runtime_product
      - kotlin_sdk_input
      - sdk
      - product_smoke
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate planned Linux jobs
        id: validate
        continue-on-error: true
        env:
          LANE_PLAN: ${{ inputs.lane_plan_json }}
          NEEDS_RESULTS: ${{ toJson(needs) }}
        run: python3 scripts/validate-ci-lane-results.py --lane-plan "$LANE_PLAN" --needs "$NEEDS_RESULTS"
      - uses: ./.github/actions/report-ci-lane
        with:
          lane_name: CI / Linux
          lane_result: ${{ steps.validate.outcome == 'success' && 'success' || 'failure' }}
          lane_check_id: ${{ inputs.lane_check_id }}
          overall_check_id: ${{ inputs.overall_check_id }}
          expected_lane_checks: ${{ inputs.expected_lane_checks }}
          source_sha: ${{ inputs.source_sha }}
          correlation_id: ${{ inputs.correlation_id }}
          plan_digest: ${{ inputs.plan_digest }}
      - name: Enforce Linux result
        if: ${{ steps.validate.outcome != 'success' }}
        run: exit 1
