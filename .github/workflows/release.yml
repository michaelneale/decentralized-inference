        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify prebuilt backend environment
        run: verify-runner-image public cpu
      - name: Download immutable host input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-input-linux-aarch64
          path: host-input
      - name: Download immutable runtime input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-native-runtime-linux-aarch64-cuda-${{ matrix.cuda_version == '12.9.2' && '12' || '13' }}
          path: runtime-input
      - name: Prepare dispatched release version
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: scripts/release-version.sh "$RELEASE_TAG"

      - name: Prepare release verification key
        env:
          MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE: ${{ runner.temp }}/mesh-release-attestation-public-key.json
          RELEASE_ATTESTATION_PUBLIC_KEY: ${{ secrets.MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE }}
        run: printf '%s' "$RELEASE_ATTESTATION_PUBLIC_KEY" > "$MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE"

      - name: Compose aarch64 CUDA product from producer inputs
        id: compose
        uses: ./.github/actions/compose-product-input
        with:
          host_input_dir: host-input
          runtime_input_dir: runtime-input
          output_dir: product-input
          version: ${{ needs.metadata.outputs.tag }}
          backend: cuda
          readiness_smoke: "true"
          attestation_public_key_file: ${{ runner.temp }}/mesh-release-attestation-public-key.json

      - name: Package verified aarch64 CUDA product
