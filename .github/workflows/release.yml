name: Release

# Set USE_SELF_HOSTED=true to route x86_64 CUDA release jobs to the dedicated
# GPU runner; unset or false uses GitHub-hosted runners.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version/tag to build, for example v0.31.0
        required: true
        type: string
      skip_gpu_bundles:
        description: Skip CUDA, CUDA Blackwell, ROCm, and Vulkan release bundles
        required: true
        default: false
        type: boolean
      canary:
        description: Dry-run mode — build + smoke everything but skip actual publishing
        required: true
        default: false
        type: boolean
      force_hosted_runners:
        description: Route the self-hosted x86_64 CUDA release lane to GitHub-hosted runners for this run only
        required: true
        default: false
        type: boolean
      use_depot:
        description: Route eligible non-GPU Linux jobs to Depot for a trusted main-ref canary
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  CACHE_NAMESPACE: mesh-llm
  SCCACHE_DIR: ${{ github.workspace }}/../.sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  SCCACHE_MULTILEVEL_CHAIN: disk,gha
  SCCACHE_MULTILEVEL_WRITE_ERROR_POLICY: ignore

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      source_sha: ${{ steps.source.outputs.sha }}
      release_notes_base: ${{ steps.source.outputs.release_notes_base }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      skip_gpu_bundles: ${{ steps.meta.outputs.skip_gpu_bundles }}
      canary: ${{ steps.meta.outputs.canary }}
      force_hosted_runners: ${{ steps.meta.outputs.force_hosted_runners }}
      depot_enabled: ${{ steps.runners.outputs.depot_enabled }}
      allow_depot_remote_cache: ${{ steps.runners.outputs.allow_depot_remote_cache }}
      allow_native_github_cache: ${{ steps.runners.outputs.allow_native_github_cache }}
      runner: ${{ steps.runners.outputs.runner }}
      runner_4: ${{ steps.runners.outputs.runner_4 }}
      runner_8: ${{ steps.runners.outputs.runner_8 }}
      runner_16: ${{ steps.runners.outputs.runner_16 }}
      runner_arm: ${{ steps.runners.outputs.runner_arm }}
      runner_arm_4: ${{ steps.runners.outputs.runner_arm_4 }}
      runner_arm_8: ${{ steps.runners.outputs.runner_arm_8 }}
      runner_arm_16: ${{ steps.runners.outputs.runner_arm_16 }}
    steps:
      - name: Require the trusted release ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual releases must be dispatched from refs/heads/main, not $GITHUB_REF." >&2
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require release tags to point at main history
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tag $GITHUB_REF must point at a commit reachable from main." >&2
            exit 1
          fi
      - id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SKIP_GPU_BUNDLES: ${{ inputs.skip_gpu_bundles || 'false' }}
          INPUT_CANARY: ${{ inputs.canary || 'false' }}
          INPUT_FORCE_HOSTED_RUNNERS: ${{ inputs.force_hosted_runners || 'false' }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_VERSION}"
          fi
          tag="v${tag#v}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $tag" >&2
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "skip_gpu_bundles=$INPUT_SKIP_GPU_BUNDLES"
            echo "canary=$INPUT_CANARY"
            echo "force_hosted_runners=$INPUT_FORCE_HOSTED_RUNNERS"
          } >> "$GITHUB_OUTPUT"
      - name: Reject an existing manual release tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.canary != true }}
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Manual release tag already exists and is immutable: $RELEASE_TAG" >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      - name: Prepare canonical release source
        id: source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          CANARY: ${{ steps.meta.outputs.canary }}
        run: |
          set -euo pipefail
          source_sha="$GITHUB_SHA"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            scripts/release-version.sh "$RELEASE_TAG"
            if ! git diff --quiet; then
              echo "Release tag $RELEASE_TAG does not contain its complete version update." >&2
              echo "Run scripts/release-version.sh $RELEASE_TAG, commit the result on main, and create a new tag." >&2
              git status --short >&2
              exit 1
            fi
          elif [[ "$CANARY" == "true" ]]; then
            echo "Canary release: leaving main unchanged."
          else
            scripts/release-version.sh "$RELEASE_TAG"
            cargo fmt --all -- --check
            git diff --check
            git add --update
            if ! git diff --quiet; then
              echo "Release version preparation left unstaged tracked changes:" >&2
              git status --short >&2
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "main already contains the complete $RELEASE_TAG version update."
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "$RELEASE_TAG: prepare release source"
            fi
            source_sha="$(git rev-parse HEAD)"
            release_remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push "$release_remote" "$source_sha:refs/heads/main"
          fi

          release_notes_base="$(
            git tag --list 'v*' |
              python3 scripts/select-release-notes-base.py "$RELEASE_TAG"
          )"
          if [[ -n "$release_notes_base" ]]; then
            echo "GitHub release notes will compare $release_notes_base...$RELEASE_TAG."
          else
            echo "No earlier stable release tag exists; GitHub release notes have no explicit comparison base."
          fi
          {
            echo "sha=$source_sha"
            echo "release_notes_base=$release_notes_base"
          } >> "$GITHUB_OUTPUT"
      - name: Select trusted Linux runners
        id: runners
        uses: ./.github/actions/select-ci-runners
        with:
          event_name: ${{ github.event_name }}
          original_event_name: ''
          repository: ${{ github.repository }}
          head_repository: ${{ github.event.pull_request.head.repo.full_name }}
          head_sha: ${{ github.sha }}
          ref: ${{ github.ref }}
          depot_main_enabled: ${{ vars.DEPOT_RUNNERS_ENABLED == 'true' }}
          depot_pr_enabled: 'false'
          manual_use_depot: ${{ inputs.use_depot == true }}

  release_ui:
    name: Prepare shared release console
    needs: metadata
    uses: ./.github/workflows/ci-ui-artifact-slice.yml
    with:
      source_sha: ${{ needs.metadata.outputs.source_sha }}
      original_event_name: ${{ github.event_name }}
      force_hosted: true
      artifact_name: prepared-release-ui-${{ needs.metadata.outputs.tag }}-${{ needs.metadata.outputs.source_sha }}
      release_tag: ${{ needs.metadata.outputs.tag }}
      retention_days: 90

  build:
    name: Build immutable host ${{ matrix.name }}
    needs: [metadata, release_ui]
    # Host attestation consumes the signing key. Keep this producer on GitHub
    # until compilation and signing are split into separate jobs.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS aarch64 Metal
            os: macos-15
            target: darwin-aarch64
          - name: Linux x86_64 CPU
            os: ubuntu-24.04
            target: linux-x86_64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20

      - uses: taiki-e/install-action@3d23c1bbdafe696dfccad2664945a04f47d03dc3 # just

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: ./.github/actions/configure-sccache-gha
        with:
          allow_depot_remote_cache: ${{ needs.metadata.outputs.allow_depot_remote_cache }}
          allow_native_github_cache: "true"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config libssl-dev libdbus-1-dev curl lld

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install macOS linker
        if: runner.os == 'macOS'
        uses: ./.github/actions/setup-macos-lld

      - name: Prepare dispatched release version
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: scripts/release-version.sh "$RELEASE_TAG"

      - name: Restore shared release UI
        uses: ./.github/actions/restore-release-ui
        with:
          artifact_name: prepared-release-ui-${{ needs.metadata.outputs.tag }}-${{ needs.metadata.outputs.source_sha }}
          source_sha: ${{ needs.metadata.outputs.source_sha }}
          release_tag: ${{ needs.metadata.outputs.tag }}

      - name: Prepare release attestation keys
        env:
          MESH_RELEASE_ATTESTATION_SIGNING_KEY_FILE: ${{ runner.temp }}/mesh-release-attestation-private-key.json
          MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE: ${{ runner.temp }}/mesh-release-attestation-public-key.json
          RELEASE_ATTESTATION_SIGNING_KEY: ${{ secrets.MESH_RELEASE_ATTESTATION_SIGNING_KEY_FILE }}
          RELEASE_ATTESTATION_PUBLIC_KEY: ${{ secrets.MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE }}
        run: |
          printf '%s' "$RELEASE_ATTESTATION_SIGNING_KEY" > "$MESH_RELEASE_ATTESTATION_SIGNING_KEY_FILE"
          printf '%s' "$RELEASE_ATTESTATION_PUBLIC_KEY" > "$MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE"

      - name: Build and attest release host
        uses: ./.github/actions/prepare-host-input
        with:
          profile: release
          skip_ui: "true"
          output_dir: host-input
          attestation_signing_key_file: ${{ runner.temp }}/mesh-release-attestation-private-key.json
          attestation_public_key_file: ${{ runner.temp }}/mesh-release-attestation-public-key.json

      - name: Upload immutable host input
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: host-input-${{ matrix.target }}
          path: host-input/*
          if-no-files-found: error

  compose_cpu_products:
    name: Compose CPU product ${{ matrix.name }}
    needs: [metadata, build, build_native_runtime]
    runs-on: ${{ matrix.host_target == 'linux-x86_64' && needs.metadata.outputs.runner_4 || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS aarch64 Metal
            os: macos-15
            host_target: darwin-aarch64
            runtime_artifact: release-native-runtime-darwin-aarch64-metal
            flavor: metal
            release_os: Darwin
            release_arch: aarch64
            artifact_name: release-macos
          - name: Linux x86_64 CPU
            os: ubuntu-24.04
            host_target: linux-x86_64
            runtime_artifact: release-native-runtime-linux-x86_64-cpu
            flavor: cpu
            release_os: Linux
            release_arch: x86_64
            artifact_name: release-linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      - name: Download immutable host input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-input-${{ matrix.host_target }}
          path: host-input
      - name: Download immutable runtime input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.runtime_artifact }}
          path: runtime-input
      - name: Prepare release verification key
        env:
          MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE: ${{ runner.temp }}/mesh-release-attestation-public-key.json
          RELEASE_ATTESTATION_PUBLIC_KEY: ${{ secrets.MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE }}
        run: printf '%s' "$RELEASE_ATTESTATION_PUBLIC_KEY" > "$MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE"

      - name: Compose from verified producer inputs
        id: compose
        uses: ./.github/actions/compose-product-input
        with:
          host_input_dir: host-input
          runtime_input_dir: runtime-input
          output_dir: product-input
          version: ${{ needs.metadata.outputs.tag }}
          backend: ${{ matrix.flavor }}
          readiness_smoke: "true"
          attestation_public_key_file: ${{ runner.temp }}/mesh-release-attestation-public-key.json

      - name: Package verified product
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          MESH_RELEASE_OS: ${{ matrix.release_os }}
          MESH_RELEASE_ARCH: ${{ matrix.release_arch }}
          MESH_RELEASE_FLAVOR: ${{ matrix.flavor }}
          MESH_LLM_RELEASE_BIN_DIR: ${{ github.workspace }}/host-input
          MESH_LLM_NATIVE_RUNTIME_ROOT: ${{ steps.compose.outputs.runtime_root }}
          MESH_LLM_PRECOMPOSED_PRODUCT_DIR: ${{ steps.compose.outputs.product_dir }}
          MESH_RELEASE_HOST_PRESTAMPED: "1"
          MESH_RELEASE_ATTESTATION_PREVERIFIED: "1"
          MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE: ${{ runner.temp }}/mesh-release-attestation-public-key.json
        run: scripts/package-release.sh "$RELEASE_TAG" dist
      - name: Upload composed release product
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error
      - name: Upload Linux composed smoke product
        if: matrix.artifact_name == 'release-linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-release-linux-inference-product
          path: ${{ steps.compose.outputs.archive_path }}
          if-no-files-found: error

  inference_smoke_tests:
    needs: [metadata, compose_cpu_products]
    if: needs.compose_cpu_products.result == 'success'
    uses: ./.github/workflows/smoke.yml
    with:
      artifact_name: ci-release-linux-inference-product
      mesh_binary_target: target/release/mesh-llm
      cache_key_prefix: release-
      release_tag: ${{ needs.metadata.outputs.tag }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  build_native_sdk_runtime:
    name: Build native SDK runtime ${{ matrix.name }}
    needs: metadata
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS aarch64 Metal
            os: macos-15
            backend: metal
            target: aarch64-apple-darwin
            artifact_suffix: darwin-aarch64-metal
          - name: Linux x86_64 CPU
            os: ubuntu-24.04
            backend: cpu
            target: x86_64-unknown-linux-gnu
            artifact_suffix: linux-x86_64-cpu
          - name: Linux aarch64 CPU
            os: ubuntu-24.04-arm
            backend: cpu
            target: aarch64-unknown-linux-gnu
            artifact_suffix: linux-aarch64-cpu
    uses: ./.github/workflows/native-sdk-artifact.yml
    with:
      original_event_name: ${{ github.event_name }}
      force_hosted: false
      backend: ${{ matrix.backend }}
      target: ${{ matrix.target }}
      profile: release
      artifact_name: release-native-sdk-${{ matrix.artifact_suffix }}
      static_abi_artifact_name: ci-release-native-sdk-static-abi-${{ matrix.artifact_suffix }}
      static_abi_artifact_path: native-sdk-static-abi-input
      produce_static_abi: ${{ endsWith(matrix.target, '-unknown-linux-gnu') }}
      runner_size: '8'
      include_runtime_crate: true
      release_tag: ${{ needs.metadata.outputs.tag }}
      prepare_release_version: ${{ github.event_name == 'workflow_dispatch' }}
      retention_days: 90
      timeout_minutes: 90

  build_node_sdk_addon:
    name: Build Node SDK addon ${{ matrix.name }}
    needs: metadata
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            target: darwin-arm64
          - name: macOS x64
            target: darwin-x64
          - name: Linux ARM64
            target: linux-arm64
          - name: Linux x64
            target: linux-x64
          - name: Windows x64
            target: win32-x64
    uses: ./.github/workflows/node-sdk-addon-artifact.yml
    with:
      target: ${{ matrix.target }}
      artifact_name: release-node-sdk-addon-${{ matrix.target }}
      release_tag: ${{ needs.metadata.outputs.tag }}
      prepare_release_version: ${{ github.event_name == 'workflow_dispatch' }}
      retention_days: 90
      timeout_minutes: 90

  build_native_runtime:
    name: Build native runtime ${{ matrix.name }}
    needs: metadata
    runs-on: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && needs.metadata.outputs.runner_8 || matrix.target == 'aarch64-unknown-linux-gnu' && needs.metadata.outputs.runner_arm_8 || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS aarch64 Metal
            os: macos-15
            backend: metal
            target: aarch64-apple-darwin
            artifact_suffix: darwin-aarch64-metal
          - name: Linux x86_64 CPU
            os: ubuntu-24.04
            backend: cpu
            target: x86_64-unknown-linux-gnu
            artifact_suffix: linux-x86_64-cpu
          - name: Linux aarch64 CPU
            os: ubuntu-24.04-arm
            backend: cpu
            target: aarch64-unknown-linux-gnu
            artifact_suffix: linux-aarch64-cpu
    env:
      LLAMA_STAGE_BACKEND: ${{ matrix.backend }}
      MESH_NATIVE_RUNTIME_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: ./.github/actions/configure-sccache-gha
        with:
          allow_depot_remote_cache: ${{ needs.metadata.outputs.allow_depot_remote_cache }}
          allow_native_github_cache: ${{ ((matrix.target == 'x86_64-unknown-linux-gnu' && startsWith(needs.metadata.outputs.runner_8, 'depot-')) || (matrix.target == 'aarch64-unknown-linux-gnu' && startsWith(needs.metadata.outputs.runner_arm_8, 'depot-'))) && 'false' || 'true' }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config libssl-dev libdbus-1-dev curl lld patchelf

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install macOS linker
        if: runner.os == 'macOS'
        uses: ./.github/actions/setup-macos-lld

      - name: Resolve hosted native toolchain epoch
        uses: ./.github/actions/resolve-native-toolchain-epoch
        with:
          include_tool_versions: "true"

      - name: Prepare dispatched release version
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: scripts/release-version.sh "$RELEASE_TAG"

      - name: Package native runtime
        uses: ./.github/actions/prepare-native-runtime-input
        with:
          backend: ${{ matrix.backend }}
          target: ${{ matrix.target }}
          output_dir: dist/native-runtimes

      - name: Upload native runtime
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-native-runtime-${{ matrix.artifact_suffix }}
          path: |
            dist/native-runtimes/*.tar.gz
            dist/native-runtimes/*.sha256
          if-no-files-found: error

  build_native_runtime_linux_aarch64_cuda:
    name: Build native runtime Linux aarch64 CUDA (${{ matrix.cuda_major }})
    needs: metadata
    if: ${{ needs.metadata.outputs.skip_gpu_bundles != 'true' }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_version: '12.9.2'
            cuda_major: '12'
            runner_image: ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:c5b85ef527230f77cf9933ef40bcb44316f9bbcb8fd2ce0651b58acda5143dfd
            toolchain_epoch: mesh-llm-cuda-runner-sha256-c5b85ef527230f77cf9933ef40bcb44316f9bbcb8fd2ce0651b58acda5143dfd
          - cuda_version: '13.1.2'
            cuda_major: '13'
            runner_image: ghcr.io/mesh-llm/mesh-llm-cuda-runner@sha256:6b87598605f5d8deeafecfb1a55027e0ca9e47f4fc6f230d030487c450c31aa6
            toolchain_epoch: mesh-llm-cuda-runner-sha256-6b87598605f5d8deeafecfb1a55027e0ca9e47f4fc6f230d030487c450c31aa6
    container:
      image: ${{ matrix.runner_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      LLAMA_STAGE_BACKEND: cuda
      MESH_NATIVE_RUNTIME_TARGET: aarch64-unknown-linux-gnu
      MESH_CUDA_VERSION: ${{ matrix.cuda_version }}
      MESH_LLM_CUDA_TOOLKIT_MAJOR: ${{ matrix.cuda_major }}
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify prebuilt backend environment
