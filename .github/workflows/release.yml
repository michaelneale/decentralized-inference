            runtime_artifact: release-native-runtime-windows-x86_64-rocm
            artifact_name: release-windows-rocm
          - name: Vulkan
            backend: vulkan
            runtime_artifact: release-native-runtime-windows-x86_64-vulkan
            artifact_name: release-windows-vulkan
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
