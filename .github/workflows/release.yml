      LLAMA_STAGE_BUILD_DIR: .deps/llama-build/windows/build-stage-abi-${{ matrix.backend }}
      MESH_NATIVE_RUNTIME_TARGET: x86_64-pc-windows-msvc
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CUDA
            backend: cuda
            cuda_architectures: '61;75;80;86;87;89;90'
            artifact_name: release-native-runtime-windows-x86_64-cuda12
          - name: ROCm
            backend: rocm
            rocm_architectures: gfx90a;gfx942;gfx1100;gfx1101;gfx1102;gfx1103;gfx1151;gfx1200;gfx1201
            artifact_name: release-native-runtime-windows-x86_64-rocm
            # sccache + hipcc is broken on Windows: HIP's multi-offload-arch
            # compile pipeline plus the long arch-derived build directory pushes
            # object paths past MAX_PATH, and sccache fails to persist its temp
            # file (os error 3). Disable the compiler launcher for this row only;
            # CUDA/Vulkan keep sccache.
            use_sccache: '0'
          - name: Vulkan
            backend: vulkan
            artifact_name: release-native-runtime-windows-x86_64-vulkan
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Resolve Windows native toolchain epoch
        id: native_toolchain
        uses: ./.github/actions/resolve-native-toolchain-epoch
      - name: Restore exact Windows GPU ABI cache
        uses: ./.github/actions/restore-windows-abi-cache
        with:
          backend: ${{ matrix.backend }}
          build_dir: ${{ env.LLAMA_STAGE_BUILD_DIR }}
          toolchain_epoch: ${{ steps.native_toolchain.outputs.epoch }}
          architecture_set: ${{ matrix.cuda_architectures || matrix.rocm_architectures || '' }}
          cuda_toolchain_version: ${{ env.WINDOWS_CUDA_VERSION }}
          vulkan_toolchain_version: ${{ env.WINDOWS_VULKAN_SDK_VERSION }}
          rocm_toolchain_version: ${{ env.ROCM_HIP_SDK_FILENAME }}
          allow-native-github-cache: "true"
      - name: Prepare dispatched release version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: scripts/release-version.sh "$RELEASE_TAG"
      - name: Validate CUDA 12 artifact contract
        if: ${{ matrix.backend == 'cuda' }}
        shell: pwsh
        run: |
          $cudaVersion = "$env:WINDOWS_CUDA_VERSION".Trim()
          $cudaMajor = ($cudaVersion -split '\.', 2)[0]
          if ($cudaMajor -ne '12') {
            throw "CUDA_VERSION must select CUDA 12.x because this release lane publishes cuda12-labelled artifacts; got '$cudaVersion'."
          }
      - name: Install CUDA toolkit
        if: ${{ matrix.backend == 'cuda' }}
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        with:
          cuda: ${{ env.WINDOWS_CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
          use-github-cache: true
          use-local-cache: true
          log-file-suffix: windows-cuda-native-runtime
      - name: Verify CUDA toolkit
        if: ${{ matrix.backend == 'cuda' }}
        shell: pwsh
        run: |
          if (-not $env:CUDA_PATH -or -not (Test-Path $env:CUDA_PATH)) {
            throw "CUDA_PATH was not configured by Jimver/cuda-toolkit."
          }
          & nvcc --version
      - name: Install Vulkan SDK
        if: ${{ matrix.backend == 'vulkan' }}
        uses: jakoch/install-vulkan-sdk-action@3c53c378c9bfbb2ea122a1cc164a837d4004c871 # v1.5.2
        with:
          vulkan_version: ${{ env.WINDOWS_VULKAN_SDK_VERSION }}
          cache: true
          stripdown: true
      - name: Verify Vulkan SDK
        if: ${{ matrix.backend == 'vulkan' }}
        shell: pwsh
        run: |
          if (-not $env:VULKAN_SDK -or -not (Test-Path $env:VULKAN_SDK)) {
            throw "VULKAN_SDK was not configured by jakoch/install-vulkan-sdk-action."
          }
          $glslc = Join-Path $env:VULKAN_SDK "Bin\glslc.exe"
          if (-not (Test-Path $glslc)) {
            throw "glslc.exe was not found at $glslc"
          }
          & $glslc --version
      - name: Install ROCm HIP SDK
        if: ${{ matrix.backend == 'rocm' }}
        uses: ./.github/actions/setup-windows-rocm-sdk
        with:
          rocm-hip-sdk-filename: ${{ env.ROCM_HIP_SDK_FILENAME }}
          allow-native-github-cache: "true"
      - name: Initialize MSVC for native runtime
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Package native runtime
        env:
          LLAMA_STAGE_BACKEND: ${{ matrix.backend }}
          LLAMA_STAGE_CUDA_ARCHITECTURES: ${{ matrix.cuda_architectures }}
          LLAMA_STAGE_AMDGPU_TARGETS: ${{ matrix.rocm_architectures }}
          LLAMA_STAGE_USE_SCCACHE: ${{ matrix.use_sccache || '1' }}
          MESH_LLM_CUDA_TOOLKIT_MAJOR: '12'
        uses: ./.github/actions/prepare-native-runtime-input
        with:
          backend: ${{ matrix.backend }}
          target: x86_64-pc-windows-msvc
          output_dir: dist/native-runtimes
      - name: Upload native runtime
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/native-runtimes/*.tar.gz
            dist/native-runtimes/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - metadata
      - release_ui
      - build
      - compose_cpu_products
      - inference_smoke_tests
      - build_native_sdk_runtime
      - build_node_sdk_addon
      - build_native_runtime
      - build_native_runtime_linux_aarch64_cuda
      - build_native_runtime_linux_x86_64_cuda
      - build_native_runtime_linux_x86_64_rocm
      - build_native_runtime_linux_x86_64_vulkan
      - build_swift_sdk_artifact
      - build_linux_arm64
      - compose_linux_arm64_cpu
      - smoke_linux_arm64_artifact
      - compose_linux_aarch64_cuda
      - compose_linux_cuda
      - compose_linux_rocm
      - compose_linux_vulkan
      - windows_host_input
      - compose_windows_cpu
      - compose_windows_gpu
      - build_native_runtime_windows_cpu
      - build_native_runtime_windows_gpu
    if: ${{ !cancelled() && needs.metadata.result == 'success' && needs.metadata.outputs.canary != 'true' && needs.compose_cpu_products.result == 'success' && needs.inference_smoke_tests.result == 'success' && needs.build_native_sdk_runtime.result == 'success' && needs.build_node_sdk_addon.result == 'success' && needs.build_native_runtime.result == 'success' && (needs.build_native_runtime_linux_aarch64_cuda.result == 'success' || needs.build_native_runtime_linux_aarch64_cuda.result == 'skipped') && (needs.build_native_runtime_linux_x86_64_cuda.result == 'success' || needs.build_native_runtime_linux_x86_64_cuda.result == 'skipped') && (needs.build_native_runtime_linux_x86_64_rocm.result == 'success' || needs.build_native_runtime_linux_x86_64_rocm.result == 'skipped') && (needs.build_native_runtime_linux_x86_64_vulkan.result == 'success' || needs.build_native_runtime_linux_x86_64_vulkan.result == 'skipped') && needs.build_swift_sdk_artifact.result == 'success' && needs.compose_linux_arm64_cpu.result == 'success' && needs.smoke_linux_arm64_artifact.result == 'success' && (needs.compose_linux_aarch64_cuda.result == 'success' || needs.compose_linux_aarch64_cuda.result == 'skipped') && (needs.compose_linux_cuda.result == 'success' || needs.compose_linux_cuda.result == 'skipped') && (needs.compose_linux_rocm.result == 'success' || needs.compose_linux_rocm.result == 'skipped') && (needs.compose_linux_vulkan.result == 'success' || needs.compose_linux_vulkan.result == 'skipped') && needs.compose_windows_cpu.result == 'success' && (needs.compose_windows_gpu.result == 'success' || needs.compose_windows_gpu.result == 'skipped') && needs.build_native_runtime_windows_cpu.result == 'success' && (needs.build_native_runtime_windows_gpu.result == 'success' || needs.build_native_runtime_windows_gpu.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          # Archive verification and manifest generation run before any push
          # credential is exposed to a shell.
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
        if: github.event_name == 'workflow_dispatch'

      - name: Restore shared release UI
        uses: ./.github/actions/restore-release-ui
        with:
          artifact_name: prepared-release-ui-${{ needs.metadata.outputs.tag }}-${{ needs.metadata.outputs.source_sha }}
          source_sha: ${{ needs.metadata.outputs.source_sha }}
          release_tag: ${{ needs.metadata.outputs.tag }}

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Remove smoke-only binary
        run: rm -f release-artifacts/mesh-llm

      - name: Generate native runtime release manifest
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          SKIP_GPU_BUNDLES: ${{ needs.metadata.outputs.skip_gpu_bundles }}
        run: |
          scripts/generate-native-runtime-release-manifest.sh \
            --tag "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --out release-artifacts/native-runtimes.json \
            release-artifacts/meshllm-native-runtime-*.tar.gz
          required_native_targets=(
            "macos/aarch64/metal"
            "linux/x86_64/cpu"
            "linux/aarch64/cpu"
            "windows/x86_64/cpu"
          )
          if [[ "$SKIP_GPU_BUNDLES" != "true" ]]; then
            required_native_targets+=(
              "linux/aarch64/cuda12"
              "linux/aarch64/cuda13"
              "linux/x86_64/cuda12"
              "linux/x86_64/cuda13"
              "linux/x86_64/rocm"
              "linux/x86_64/vulkan"
              "windows/x86_64/cuda12"
              "windows/x86_64/rocm"
              "windows/x86_64/vulkan"
            )
          fi
          validator_args=(--manifest release-artifacts/native-runtimes.json)
          for target in "${required_native_targets[@]}"; do
            validator_args+=(--required-target "$target")
          done
          scripts/validate-release-native-runtime-matrix.py \
            "${validator_args[@]}" \
            release-artifacts/*
          shasum -a 256 release-artifacts/native-runtimes.json | awk '{print $1 "  native-runtimes.json"}' > release-artifacts/native-runtimes.json.sha256

      - name: Download generated SwiftPM manifest
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: swift-package-manifest
          path: generated-swift-manifest

      - name: Download generated Swift binding
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-swift-binding-release-swift-sdk
          path: generated-swift-binding

      - name: Prepare dispatched release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists and cannot be reused: $RELEASE_TAG" >&2
            exit 1
          fi
          scripts/release-version.sh "$RELEASE_TAG"
          cp generated-swift-manifest/Package.swift Package.swift
          generated_binding="generated-swift-binding/mesh_ffi.swift"
          tracked_binding="sdk/swift/Sources/MeshLLM/Generated/mesh_ffi.swift"
          if [[ ! -f "$generated_binding" || -L "$generated_binding" ]]; then
            echo "generated Swift binding artifact is missing or unsafe: $generated_binding" >&2
            exit 1
          fi
          install -m 0644 "$generated_binding" "$tracked_binding"
          cmp "$generated_binding" "$tracked_binding"
          scripts/package-sdk-console-assets.sh --sdk all --skip-build
          scripts/verify-sdk-console-assets.sh --sdk all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # release-version.sh owns the complete tracked version surface. Stage
          # all tracked release-preparation changes so this list cannot drift
          # when another version-bearing file is added to the script.
          git add --update
          git add -f sdk/node/console sdk/swift/Sources/MeshLLM/Resources/Console sdk/kotlin/src/main/resources/mesh-llm/console
          if ! git diff --quiet; then
            echo "Release preparation left unstaged tracked changes:" >&2
            git status --short >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Release source files already match $RELEASE_TAG"
          else
            git commit -m "$RELEASE_TAG: prepare release source"
          fi
          git tag "$RELEASE_TAG"

      - name: Push dispatched release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          release_remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$release_remote" "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          generate_release_notes: true
          previous_tag: ${{ needs.metadata.outputs.release_notes_base }}
          overwrite_files: false
          files: release-artifacts/*

  dispatch_packaging_release:
    name: Dispatch package and image publishing
    needs: [metadata, publish]
    if: ${{ needs.publish.result == 'success' && needs.metadata.outputs.prerelease != 'true' && needs.metadata.outputs.skip_gpu_bundles != 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Dispatch verified release to mesh-packaging
        env:
          GH_TOKEN: ${{ secrets.MESH_AGENT_IMAGES_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || {
            echo "MESH_AGENT_IMAGES_DISPATCH_TOKEN must grant Contents write access to Mesh-LLM/mesh-packaging for cross-repository dispatch" >&2
            exit 1
          }
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$RELEASE_TAG" \
            --arg version "$RELEASE_VERSION" \
            '{
              event_type: "mesh-llm-release",
              client_payload: {
                repository: $repository,
                ref: $ref,
                version: $version,
                dry_run: false,
                publish_images: true,
                publish_release_assets: true,
                publish_npm: true
              }
            }' |
            gh api \
              --method POST \
              repos/Mesh-LLM/mesh-packaging/dispatches \
              --input -

  publish_crates_preflight:
    name: Preflight crates.io packages
    needs: [metadata, publish]
    if: ${{ needs.metadata.outputs.prerelease != 'true' && needs.metadata.outputs.canary != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      - name: Prepare dispatched release version
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: scripts/release-version.sh "$RELEASE_TAG"
      - name: Check crates.io publish-chain consistency
        run: cargo run -p xtask -- repo-consistency publish-crates
      - name: Dry-run crates.io package chain
        run: scripts/publish-crates.sh --dry-run --allow-dirty --sleep-seconds 0

  publish_crates:
    name: Publish crates.io packages
    needs: [metadata, publish, publish_crates_preflight]
    if: ${{ needs.metadata.outputs.prerelease != 'true' && needs.metadata.outputs.canary != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      - name: Prepare dispatched release version
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: scripts/release-version.sh "$RELEASE_TAG"
      - name: Publish crates.io package chain
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crates.sh
