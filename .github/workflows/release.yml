      timeout_minutes: 180

  build_linux_arm64:
    name: Build immutable host Linux ARM64
    needs: [metadata, release_ui]
    # Host attestation consumes the signing key. Keep this producer on GitHub
    # until compilation and signing are split into separate jobs.
    runs-on: ubuntu-24.04-arm
    env:
      LLAMA_STAGE_BACKEND: cpu
      MESH_RELEASE_ARCH: aarch64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      - uses: taiki-e/install-action@3d23c1bbdafe696dfccad2664945a04f47d03dc3 # just
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config libssl-dev libdbus-1-dev curl lld
      - name: Prepare dispatched release version
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: scripts/release-version.sh "$RELEASE_TAG"
      - name: Restore shared release UI
        uses: ./.github/actions/restore-release-ui
        with:
          artifact_name: prepared-release-ui-${{ needs.metadata.outputs.tag }}-${{ needs.metadata.outputs.source_sha }}
          source_sha: ${{ needs.metadata.outputs.source_sha }}
          release_tag: ${{ needs.metadata.outputs.tag }}

      - name: Prepare release attestation keys
        env:
          MESH_RELEASE_ATTESTATION_SIGNING_KEY_FILE: ${{ runner.temp }}/mesh-release-attestation-private-key.json
          MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE: ${{ runner.temp }}/mesh-release-attestation-public-key.json
          RELEASE_ATTESTATION_SIGNING_KEY: ${{ secrets.MESH_RELEASE_ATTESTATION_SIGNING_KEY_FILE }}
          RELEASE_ATTESTATION_PUBLIC_KEY: ${{ secrets.MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE }}
        run: |
          printf '%s' "$RELEASE_ATTESTATION_SIGNING_KEY" > "$MESH_RELEASE_ATTESTATION_SIGNING_KEY_FILE"
          printf '%s' "$RELEASE_ATTESTATION_PUBLIC_KEY" > "$MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE"

      - name: Build and attest ARM64 release host
        uses: ./.github/actions/prepare-host-input
        with:
          profile: release
          skip_ui: "true"
          output_dir: host-input
          attestation_signing_key_file: ${{ runner.temp }}/mesh-release-attestation-private-key.json
          attestation_public_key_file: ${{ runner.temp }}/mesh-release-attestation-public-key.json

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: host-input-linux-aarch64
          path: host-input/*
          if-no-files-found: error

  compose_linux_arm64_cpu:
    name: Compose Linux ARM64 CPU product
    needs: [metadata, build_linux_arm64, build_native_runtime]
    runs-on: ${{ needs.metadata.outputs.runner_arm_4 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-input-linux-aarch64
          path: host-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-native-runtime-linux-aarch64-cpu
          path: runtime-input
      - name: Prepare release verification key
        env:
          MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE: ${{ runner.temp }}/mesh-release-attestation-public-key.json
          RELEASE_ATTESTATION_PUBLIC_KEY: ${{ secrets.MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE }}
        run: printf '%s' "$RELEASE_ATTESTATION_PUBLIC_KEY" > "$MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE"

      - name: Compose from verified producer inputs
        id: compose
        uses: ./.github/actions/compose-product-input
        with:
          host_input_dir: host-input
          runtime_input_dir: runtime-input
          output_dir: product-input
          version: ${{ needs.metadata.outputs.tag }}
          backend: cpu
          readiness_smoke: "true"
          attestation_public_key_file: ${{ runner.temp }}/mesh-release-attestation-public-key.json

      - name: Package verified ARM64 CPU product
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          MESH_RELEASE_OS: Linux
          MESH_RELEASE_ARCH: aarch64
          MESH_RELEASE_FLAVOR: cpu
          MESH_LLM_RELEASE_BIN_DIR: ${{ github.workspace }}/host-input
          MESH_LLM_NATIVE_RUNTIME_ROOT: ${{ steps.compose.outputs.runtime_root }}
          MESH_LLM_PRECOMPOSED_PRODUCT_DIR: ${{ steps.compose.outputs.product_dir }}
          MESH_RELEASE_HOST_PRESTAMPED: "1"
          MESH_RELEASE_ATTESTATION_PREVERIFIED: "1"
          MESH_RELEASE_ATTESTATION_PUBLIC_KEY_FILE: ${{ runner.temp }}/mesh-release-attestation-public-key.json
        run: scripts/package-release.sh "$RELEASE_TAG" dist

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-linux-arm64
          path: dist/*
          if-no-files-found: error

  smoke_linux_arm64_artifact:
    name: Smoke Linux ARM64 artifact
    needs: [metadata, compose_linux_arm64_cpu]
    if: ${{ needs.compose_linux_arm64_cpu.result == 'success' }}
    runs-on: ${{ needs.metadata.outputs.runner_arm }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux-arm64
          path: release-linux-arm64
      - name: Verify and smoke ARM64 release artifact
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          artifact_dir="release-linux-arm64"
          tarball="$artifact_dir/mesh-llm-aarch64-unknown-linux-gnu.tar.gz"
          if [[ ! -f "$tarball" ]]; then
            echo "missing expected ARM64 release archive: $tarball" >&2
            find "$artifact_dir" -maxdepth 1 -type f -print | sort >&2
            exit 1
          fi
          python3 scripts/verify-checksum-sidecar.py "$tarball"
          mkdir -p smoke
          python3 scripts/safe-extract-tar.py "$tarball" smoke
          binary="smoke/mesh-bundle/mesh-llm"
          version_output="$("$binary" --version)"
          actual_version="$(awk '{print $NF}' <<<"$version_output")"
          if [[ "$actual_version" != "$EXPECTED_VERSION" ]]; then
            echo "ARM64 artifact version mismatch: expected $EXPECTED_VERSION, got ${actual_version:-<empty>}" >&2
            echo "Output: $version_output" >&2
            exit 1
          fi
          "$binary" --help | head -5
          "$binary" runtime --help | head -20
          scripts/ci-hf-xet-portability-smoke.sh "$binary"

  compose_linux_aarch64_cuda:
    name: Compose Linux aarch64 CUDA (${{ matrix.cuda_version }})
    needs: [metadata, build_linux_arm64, build_native_runtime_linux_aarch64_cuda]
    if: ${{ needs.metadata.outputs.skip_gpu_bundles != 'true' }}
