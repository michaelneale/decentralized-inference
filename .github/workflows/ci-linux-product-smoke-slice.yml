name: CI Linux Product Smoke Slice

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable product source revision.
        required: true
        type: string
      smoke_matrix:
        description: JSON platform smoke rows from the versioned CI plan.
        required: true
        type: string
      binary_target:
        description: Product binary path used by the smoke harness.
        required: true
        type: string
      timeout_minutes:
        description: Bounded smoke timeout.
        required: false
        default: 25
        type: number
    secrets:
      HF_TOKEN:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  # Keep catalogued CPU consumers executable until the typed-suite catalog
  # migration is qualified and bootstrapped. New IDs below are not aliases.
  core:
    name: Core inference smoke
    if: ${{ contains(fromJson(inputs.smoke_matrix).*.id, 'core') }}
    uses: ./.github/workflows/smoke.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      artifact_name: ci-product-linux-amd64-cpu
      artifact_path: ci-artifacts/linux
      mesh_binary_target: ${{ inputs.binary_target }}
      cache_key_prefix: ""
      timeout_minutes: ${{ inputs.timeout_minutes }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  two_node_client:
    name: Two-node client smoke
    if: ${{ contains(fromJson(inputs.smoke_matrix).*.id, 'two-node-client') }}
    uses: ./.github/workflows/scripted-binary-smoke.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      artifact_name: ci-product-linux-amd64-cpu
      artifact_path: ci-artifacts/linux
      staged_binary_path: ${{ inputs.binary_target }}
      model_cache_scope: two-node-smoke-model
      smoke_script: scripts/ci-two-node-client-serving-smoke.sh
      timeout_minutes: ${{ inputs.timeout_minutes }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  two_node_split:
    name: KV caching smoke (dense + recurrent)
    if: ${{ contains(fromJson(inputs.smoke_matrix).*.id, 'two-node-split') }}
    uses: ./.github/workflows/scripted-binary-smoke.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      artifact_name: ci-product-linux-amd64-cpu
      artifact_path: ci-artifacts/linux
      staged_binary_path: ${{ inputs.binary_target }}
      model_url: https://huggingface.co/unsloth/SmolLM2-135M-Instruct-GGUF/resolve/9e6855bc4be717fca1ef21360a1db4b29d5c559a/SmolLM2-135M-Instruct-Q8_0.gguf
      model_file: SmolLM2-135M-Instruct-Q8_0.gguf
      model_cache_scope: two-node-split-smoke-model
      smoke_script: scripts/ci-two-node-split-smoke.sh
      kv_recurrent_model_url: https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/6ab461498e2023f6e3c1baea90a8f0fe38ab64d0/Qwen3.5-0.8B-Q4_K_M.gguf
      kv_recurrent_model_file: Qwen3.5-0.8B-Q4_K_M.gguf
      kv_recurrent_model_cache_scope: two-node-split-recurrent-smoke-model
      kv_recurrent_context_size: '4096'
      kv_recurrent_expected_exact_payload_kind: kv-recurrent
      timeout_minutes: ${{ inputs.timeout_minutes }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  product_integration_cpu:
    name: CPU product integration suite
    if: ${{ contains(fromJson(inputs.smoke_matrix).*.id, 'product-integration-cpu') }}
    uses: ./.github/workflows/product-integration-smoke.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      artifact_name: ci-product-linux-amd64-cpu
      artifact_path: ci-artifacts/linux
      staged_binary_path: ${{ inputs.binary_target }}
      platform: linux
      backend: cpu
      timeout_minutes: ${{ inputs.timeout_minutes }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  product_integration_cuda:
    name: CUDA product integration suite
    if: ${{ contains(fromJson(inputs.smoke_matrix).*.id, 'product-integration-cuda') }}
    uses: ./.github/workflows/product-integration-smoke.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      artifact_name: ci-product-linux-amd64-cuda
      artifact_path: ci-artifacts/linux-cuda
      staged_binary_path: ${{ inputs.binary_target }}
      platform: linux
      backend: cuda
      timeout_minutes: ${{ inputs.timeout_minutes }}

  product_integration_vulkan:
    name: Vulkan product integration suite
    if: ${{ contains(fromJson(inputs.smoke_matrix).*.id, 'product-integration-vulkan') }}
    uses: ./.github/workflows/product-integration-smoke.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      artifact_name: ci-product-linux-amd64-vulkan
      artifact_path: ci-artifacts/linux-vulkan
      staged_binary_path: ${{ inputs.binary_target }}
      platform: linux
      backend: vulkan
      timeout_minutes: ${{ inputs.timeout_minutes }}

  product_integration_rocm:
    name: ROCm product integration suite
    if: ${{ contains(fromJson(inputs.smoke_matrix).*.id, 'product-integration-rocm') && vars.MESH_ROCM_INFERENCE_RUNNER_ENABLED == 'true' }}
    uses: ./.github/workflows/product-integration-smoke.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      artifact_name: ci-product-linux-amd64-rocm
      artifact_path: ci-artifacts/linux-rocm
      staged_binary_path: ${{ inputs.binary_target }}
      platform: linux
      backend: rocm
      timeout_minutes: ${{ inputs.timeout_minutes }}

  qwen_recurrent_gate:
    name: Qwen3.5 recurrent migration gate
    if: ${{ contains(fromJson(inputs.smoke_matrix).*.id, 'qwen-recurrent-gate') }}
    uses: ./.github/workflows/scripted-binary-smoke.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      artifact_name: ci-product-linux-amd64-cpu
      artifact_path: ci-artifacts/linux
      staged_binary_path: ${{ inputs.binary_target }}
      model_url: https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/6ab461498e2023f6e3c1baea90a8f0fe38ab64d0/Qwen3.5-0.8B-Q4_K_M.gguf
      model_file: Qwen3.5-0.8B-Q4_K_M.gguf
      model_cache_scope: two-node-split-recurrent-smoke-model
      model_context_size: '4096'
      expected_exact_payload_kind: kv-recurrent
      smoke_script: scripts/ci-two-node-split-smoke.sh
      timeout_minutes: ${{ inputs.timeout_minutes }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  core_cuda:
    name: CUDA inference smoke
    if: ${{ contains(fromJson(inputs.smoke_matrix).*.id, 'core-cuda') }}
    uses: ./.github/workflows/smoke.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      artifact_name: ci-product-linux-amd64-cuda
      artifact_path: ci-artifacts/linux-cuda
      mesh_binary_target: ${{ inputs.binary_target }}
      cache_key_prefix: ""
      runner: gpu-nvidia
      timeout_minutes: ${{ inputs.timeout_minutes }}

  model_download:
    name: Model download smoke
    if: ${{ contains(fromJson(inputs.smoke_matrix).*.id, 'model-download') }}
    uses: ./.github/workflows/hf-download-smoke.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
