[package]
name = "skippy-server"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Embedded Skippy staged runtime server"
repository = "https://github.com/Mesh-LLM/mesh-llm"
homepage = "https://github.com/Mesh-LLM/mesh-llm"

[lib]
name = "skippy_server"
path = "src/lib.rs"

[features]
default = []
dynamic-native-runtime = ["skippy-runtime/dynamic-native-runtime"]
test-support = []

[dependencies]
ahash.workspace = true
anyhow.workspace = true
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
blake3.workspace = true
clap.workspace = true
futures-util = "0.3"
skippy-runtime = { path = "../skippy-runtime", version = "0.76.0-rc9"  }
skippy-scheduler = { path = "../skippy-scheduler", version = "0.76.0-rc9" }
skippy-tokenizer = { path = "../skippy-tokenizer", version = "0.76.0-rc9" }
model-artifact = { path = "../model-artifact", version = "0.76.0-rc9" }
mesh-llm-events = { path = "../mesh-llm-events", version = "0.76.0-rc9" }
mesh-native-serving-plugin-api = { path = "../mesh-native-serving-plugin-api", version = "0.76.0-rc9" }
skippy-protocol = { path = "../skippy-protocol", version = "0.76.0-rc9"  }
skippy-cache = { path = "../skippy-cache", version = "0.76.0-rc9"  }
skippy-metrics = { path = "../skippy-metrics", version = "0.76.0-rc9"  }
skippy-topology = { path = "../skippy-topology", version = "0.76.0-rc9" }
openai-frontend = { path = "../openai-frontend", version = "0.76.0-rc9"  }
opentelemetry-proto = "0.32.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2 = "0.6"
libc = "0.2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tonic = "0.14"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
skippy-package-format = { path = "../skippy-package-format", version = "0.76.0-rc9" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
