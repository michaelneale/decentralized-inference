[package]
name = "endpoint-discovery"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Detect OpenAI-compatible LLM servers already running on the local machine"
repository = "https://github.com/Mesh-LLM/mesh-llm"
homepage = "https://github.com/Mesh-LLM/mesh-llm"
readme = "README.md"
keywords = ["llm", "mesh", "discovery", "openai"]
categories = ["network-programming"]

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13", features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }
