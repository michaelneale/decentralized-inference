# Task 6-fix defect B (`.omo/plans/event-system-fixes.md`): disclosure
# record for an undisclosed `runtime_state` wire-shape change task 6
# (d6b5925bc) landed. This table is descriptive only -- read by neither
# `scripts/generate-runtime-event-inventory.py` nor the Rust
# `Inventory` struct (`tests/inventory_contract/support.rs` has no
# `deny_unknown_fields`), so it cannot perturb the generated
# manifest/TS fixture or the frozen `state_top_level_keys` SET
# (`fixtures/runtime_events_v1/frames.json`), which is unchanged. It
# exists purely so a durable, machine-parseable trace of the amendment
# lives in the canonical inventory, per the amendment procedure above,
# rather than only in a task's evidence directory.
[[state_projection_amendments]]
field = "sessions"
from_shape = "array (frozen placeholder, always empty, no production write path)"
to_shape = "object {active_count: number, recent: [{id, state}]}"
task = "6-fix"
reason = "Task 6 populated runtime_state.sessions from the reducer per the plan text ('active count and bounded recent') as an aggregate object, changing the wire shape without recording it -- corrected by task 6-fix's disclosure. The frozen state_top_level_keys SET is unchanged; only this key's value type changed."

[[state_projection_amendments]]
field = "cache"
from_shape = "array (frozen placeholder, always empty, no production write path)"
to_shape = "object {pressure?: string, capacity_state?: string}"
task = "6-fix"
reason = "Same disclosure gap as sessions above: Task 6 populated runtime_state.cache from DomainState::cache() (a single latest-wins KV pressure/capacity signal) as an aggregate object instead of the empty-array placeholder, undisclosed until task 6-fix."

# Task 6-fix R1 (`.omo/plans/event-system-fixes.md`): disclosure record for
# a NEW frozen bound this task introduces (not a wire-shape change, hence
# a separate table from `state_projection_amendments` above). Descriptive
# only, exactly like that table -- read by neither
# `scripts/generate-runtime-event-inventory.py` nor the Rust `Inventory`
# struct (`tests/inventory_contract/support.rs` has no
# `deny_unknown_fields`), so it cannot perturb the generated manifest/TS
# fixture. Exists so the constant's provenance and arithmetic are
# machine-parseable in the canonical inventory per the amendment
# procedure, alongside `.omo/evidence/event-system-fixes/task-06/amendment-note-2.txt`.
[[reducer_bound_amendments]]
constant = "UNRESERVED_OPERATION_BOUND"
location = "crates/mesh-llm-host-runtime/src/runtime_events/config.rs"
value = 4096
derivation = "= STATE_TRANSITION_LANE_DEPTH (direct const-expr alias, not a duplicated literal)"
task = "6-fix"
reason = "Bounds reducer-tracked operations whose OperationState::ever_reserved is false (a scope that was NEVER associated with a reservation, e.g. unreserved_ingress with a fresh OperationId per event -- KV cache lookups, session lifecycle, node/topology/model-lifecycle observers). Such a scope can never settle (no Terminal is accepted with no SlotHandle) and can never be release-evicted (nothing to release), so it was previously unbounded: the release-triggered eviction path (task 6-fix defect A) cannot reach it, and the settled-only backstop (evict_settled_over_capacity) filters on `settled`, which it never becomes. ReducerSnapshot's new `unreserved_order` bounded LRU (reducer/state.rs) enforces this ceiling directly."

[[reducer_bound_amendments]]
constant = "TOTAL_OPERATION_BOUND"
location = "crates/mesh-llm-host-runtime/src/runtime_events/config.rs"
value = 7232
derivation = "= RESERVATION_TABLE_CAPACITY (3136) + UNRESERVED_OPERATION_BOUND (4096)"
task = "6-fix"
reason = "The reducer's TRUE total structural ceiling on operation_count(): the pre-existing RESERVATION_TABLE_CAPACITY bound (reservation-backed scopes, backstopped by evict_settled_over_capacity) plus the new UNRESERVED_OPERATION_BOUND (never-reserved scopes, unreserved_order). EngineHealth::bump_reducer_eviction_stalled now compares against this combined ceiling instead of the old RESERVATION_TABLE_CAPACITY-only check, which legitimate unreserved traffic could exceed without anything actually being stalled."

[[health_bound_amendments]]
constant = "INGRESS_LATENCY_RESERVOIR_CAPACITY"
location = "crates/mesh-llm-host-runtime/src/runtime_events/config.rs"
value = 4096
derivation = "frozen literal from the plan's Frozen additions and amendments table: 'Ingress p99 reservoir | 4,096 most recent try_submit durations, fixed ring, microsecond resolution'"
task = "13"
reason = "Bounds the fixed ring of recent try_submit ingress-latency samples (runtime_events::ingress_latency::IngressLatencyReservoir) behind runtime_health's ingress_p99_us wire field and the event_system_health log line, written unconditionally on every submit independent of whether OTLP telemetry is installed. A NEW table, not reducer_bound_amendments, because this bound governs the health/telemetry ingress-latency reservoir, not the reducer's operations map -- reusing that table's name would misdescribe its purpose. Numerically equal to STATE_TRANSITION_LANE_DEPTH but deliberately NOT aliased to it (unlike UNRESERVED_OPERATION_BOUND's real structural alias above): the two bound structurally unrelated things (a (scope, kind) coalescing map vs. a duration-sample ring), so sharing a name would be exactly the D12 defect class (three private duplicate copies of a bound with no real relationship)."

[[health_bound_amendments]]
constant = "INGRESS_LATENCY_MIN_SAMPLES"
location = "crates/mesh-llm-host-runtime/src/runtime_events/config.rs"
value = 100
derivation = "frozen literal from the plan's Frozen additions and amendments table: 'runtime_health additions | bounds object ... and ingress_p99_us (nullable until 100 samples exist)'"
task = "13"
reason = "The minimum number of recorded ingress-latency samples before ingress_p99_us reports Some instead of null. Reused as EngineHealth::bump_for_ingress_latency_milestone's cadence: RuntimeEventEngine::submit bumps the shared health_version once per this many newly recorded samples (via IngressLatencyReservoir::record's milestone return), so a genuinely-changed p99 is periodically observable through the existing change-gated health-delivery contract without bumping -- and so gating delivery -- on every single submission (see .omo/evidence/event-system-fixes/task-13/p99-cadence-note.txt)."

