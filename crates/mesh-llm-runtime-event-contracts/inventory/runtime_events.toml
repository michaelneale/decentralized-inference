# Task 10 (`.omo/plans/event-system-fixes.md`, defect D7): the
# runtime-scoped native event reporter's family map. Each row pins one
# native (feature_bit, native_kind) pair -- feature_bit is the
# `SKIPPY_FEATURE_*` bit (32-36) gating the emitting `skippy_emit_*_event`
# function, native_kind is the raw `SKIPPY_RUNTIME_EVENT_KIND_*` numeric
# value from `third_party/llama.cpp/patches/0058-0062-skippy-add-*-events-
# family-bit-*.patch` (mirrored by `skippy_ffi::abi::SkippyRuntimeEventKind`
# and `skippy_runtime::RuntimeEventKind`) -- to exactly one event_id already
# present in this file's families/catalog. Unlike `state_projection_amendments`
# and `reducer_bound_amendments` below, this table IS read by the Rust
# `Inventory` struct (`tests/inventory_contract/support.rs`) and validated by
# `tests/inventory_contract/native_family_mappings.rs`: every row's
# (feature_bit, native_kind) pair is unique, every feature_bit is in 32..=36,
# and every event_id is a real id from `mesh_llm_runtime_event_contracts::
# families::all_event_ids()`. Kind values 1-5 (`SKIPPY_RUNTIME_EVENT_KIND_
# MODEL_OPEN_*`, feature bit 24/`native_callback_kinds` above) are the
# separate per-call model-open reporter's family and are deliberately absent
# here.
#
# Bits renumbered during the origin/main rebase (event-system-fixes rebase,
# `.omo/evidence/event-system-fixes/rebase/`): main independently claimed
# bits 29 (SKIPPY_FEATURE_ACTIVATION_BOUNDARY) and 30 (SKIPPY_FEATURE_MODEL_SOURCE)
# for unrelated capabilities, so this family's six bits (reporter registration
# plus these five families) shifted from 29-34 to 31-36, preserving relative
# order: reporter=31, model_load_v2=32, kv=33, device=34, diagnostic=35,
# unload=36. Every row below moved feature_bit +2 (30->32, 31->33, 32->34,
# 33->35, 34->36) in lockstep with `crates/skippy-ffi/src/abi.rs`,
# `crates/skippy-ffi/src/lib.rs`, `crates/skippy-runtime/src/capability_probe.rs`,
# and `tests/inventory_contract/native_family_mappings.rs`'s independent
# transcription below.
[[native_family_mappings]]
feature_bit = 32
native_kind = 100
native_kind_name = "MODEL_LOAD_PHASE_CHANGED"
event_id = "model_load_phase_changed"
